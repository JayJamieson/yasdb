# fly.toml app configuration file generated for yasdb on 2026-07-31T09:57:15+12:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'yasdb'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '4437'
  YASDB_DATA = '/data/yasdb'
  YASDB_DURABILITY = 'notifier'
  YASDB_FLUSH = '5ms'
  YASDB_METRICS_ADDR = ':9091'
  YASDB_COMPACTOR_MAX_SUBCOMPACTIONS = '8'
  YASDB_ADMIN_BULK_PROVISION = '0'

[[mounts]]
  source = 'yasdb_data'
  destination = '/data'

# Native SlateDB engine metrics (write/compaction/cache/object-store), scraped
# by Fly's platform over the private network — not exposed via [http_service]
# — and visible in the org's built-in Grafana at fly-metrics.net. See
# deploy/grafana-slatedb-dashboard.json for a starter dashboard.
[metrics]
  port = 9091
  path = '/metrics'

[http_service]
  internal_port = 4437
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/__health'

  [http_service.concurrency]
    type = "requests"
    soft_limit = 2000
    hard_limit = 2500

[[vm]]
  cpu_kind = "performance"
  memory = '8gb'
  cpus = 4
  memory_mb = 8192
